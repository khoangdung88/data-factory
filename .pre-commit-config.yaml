repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Golden fixtures are recorded bytes (hashed in _manifest.json): never rewrite them.
      - id: trailing-whitespace
        exclude: ^datasets/[^/]+/fixtures/
      - id: end-of-file-fixer
        exclude: ^datasets/[^/]+/fixtures/
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
