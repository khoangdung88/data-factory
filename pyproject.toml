[project]
name = "datafactory"
version = "0.1.0"
description = "Collect, process and publish data as sellable data products."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6,<7",
    "typer>=0.12,<1",
]

[project.scripts]
datafactory = "datafactory.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.14",
    "mypy>=1.10",
    "import-linter>=2.1",
    "pre-commit>=3.7",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datafactory"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["datafactory"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs real external services (skipped in CI)"]

[tool.importlinter]
root_package = "datafactory"

[[tool.importlinter.contracts]]
name = "Layers: cli -> pipeline -> stages -> contracts -> core"
type = "layers"
layers = [
    "datafactory.cli",
    "datafactory.pipeline",
    "datafactory.collect | datafactory.process | datafactory.publish",
    "datafactory.contracts",
    "datafactory.core",
]

[[tool.importlinter.contracts]]
name = "Plugins do not import each other"
type = "independence"
modules = [
    "datafactory.collect.connectors.*",
    "datafactory.process.processors.*",
    "datafactory.process.readers.*",
    "datafactory.publish.publishers.*",
]
